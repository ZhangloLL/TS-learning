<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1976d2"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="550" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">迭代器与生成器工作流程</text>

  <!-- ========== 左侧：迭代器 ========== -->
  <rect x="30" y="60" width="480" height="400" rx="12" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
  <text x="270" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">迭代器（Iterator）</text>

  <!-- 迭代器协议框 -->
  <rect x="60" y="110" width="200" height="130" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="160" y="135" text-anchor="middle" font-weight="bold" fill="#0d47a1">迭代器协议</text>
  <line x1="80" y1="145" x2="240" y2="145" stroke="#1976d2" stroke-width="1"/>
  <text x="160" y="168" text-anchor="middle" font-size="12" fill="#1565c0">实现 Symbol.iterator</text>
  <text x="160" y="192" text-anchor="middle" font-size="12" fill="#1565c0">返回 next() 方法</text>
  <text x="160" y="218" text-anchor="middle" font-size="12" fill="#1565c0">{ done, value }</text>

  <!-- for...of 循环框 -->
  <rect x="290" y="110" width="200" height="130" rx="8" fill="#e8eaf6" stroke="#283593" stroke-width="2"/>
  <text x="390" y="135" text-anchor="middle" font-weight="bold" fill="#1a237e">for...of 循环</text>
  <line x1="310" y1="145" x2="470" y2="145" stroke="#283593" stroke-width="1"/>
  <text x="390" y="168" text-anchor="middle" font-size="12" fill="#283593">自动调用 next()</text>
  <text x="390" y="192" text-anchor="middle" font-size="12" fill="#283593">遍历所有元素</text>
  <text x="390" y="218" text-anchor="middle" font-size="12" fill="#283593">done=true 时停止</text>

  <!-- 迭代器箭头连接 -->
  <line x1="260" y1="175" x2="282" y2="175" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 工作流程箭头 -->
  <path d="M 160 240 L 160 280 L 390 280 L 390 248" stroke="#1976d2" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="275" y="270" text-anchor="middle" font-size="11" fill="#1976d2" font-weight="bold">调用</text>

  <!-- 右侧：生成器 ========== -->
  <rect x="540" y="60" width="530" height="400" rx="12" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
  <text x="805" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">生成器（Generator）</text>

  <!-- 生成器基础框 -->
  <rect x="570" y="110" width="220" height="130" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="680" y="135" text-anchor="middle" font-weight="bold" fill="#1b5e20">生成器</text>
  <line x1="590" y1="145" x2="770" y2="145" stroke="#2e7d32" stroke-width="1"/>
  <text x="680" y="168" text-anchor="middle" font-size="12" fill="#2e7d32">function*</text>
  <text x="680" y="192" text-anchor="middle" font-size="12" fill="#2e7d32">yield 暂停</text>
  <text x="680" y="218" text-anchor="middle" font-size="12" fill="#2e7d32">惰性计算</text>

  <!-- 生成器特性框 -->
  <rect x="820" y="110" width="220" height="200" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="930" y="135" text-anchor="middle" font-weight="bold" fill="#e65100">生成器特性</text>
  <line x1="840" y1="145" x2="1020" y2="145" stroke="#e65100" stroke-width="1"/>
  
  <rect x="845" y="158" width="170" height="38" rx="6" fill="#ffe0b2" stroke="#ffb74d" stroke-width="1"/>
  <text x="930" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">惰性求值</text>
  <text x="930" y="191" text-anchor="middle" font-size="11" fill="#bf360c">按需生成</text>

  <rect x="845" y="204" width="170" height="38" rx="6" fill="#ffe0b2" stroke="#ffb74d" stroke-width="1"/>
  <text x="930" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">状态保持</text>
  <text x="930" y="237" text-anchor="middle" font-size="11" fill="#bf360c">暂停位置</text>

  <rect x="845" y="250" width="170" height="38" rx="6" fill="#ffe0b2" stroke="#ffb74d" stroke-width="1"/>
  <text x="930" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">可组合</text>
  <text x="930" y="283" text-anchor="middle" font-size="11" fill="#bf360c">yield* 委托</text>

  <!-- 生成器箭头连接 -->
  <line x1="790" y1="175" x2="812" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部：迭代器与生成器的关系 -->
  <rect x="180" y="340" width="740" height="50" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="550" y="362" text-anchor="middle" font-size="13" fill="#4a148c">
    生成器函数执行后返回一个迭代器对象，同时支持迭代器协议与生成器特性
  </text>
  <text x="550" y="380" text-anchor="middle" font-size="12" fill="#6a1b9a">
    Generator 实现 Iterator 接口，是迭代器的“增强版”
  </text>

  <!-- 从生成器到迭代器的虚线连接 -->
  <line x1="570" y1="175" x2="260" y2="310" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="400" y="310" text-anchor="middle" font-size="10" fill="#6a1b9a">返回迭代器对象</text>

</svg>